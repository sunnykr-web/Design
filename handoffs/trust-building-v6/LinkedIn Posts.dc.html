<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&amp;display=swap" rel="stylesheet">
<script src="./linkedin-posts.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; background: #F3EEE6; color: #0E0C0B; font-family: 'DM Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; overflow-x: clip; }
  a { color: inherit; text-decoration: none; }
  a:hover { color: inherit; }
  ::selection { background: #E4041C; color: #FFFFFF; }
</style>
</helmet>
<div style="width:100%;overflow-x:clip;background:#F3EEE6;min-height:100vh">
  <header style="position:fixed;top:0;left:0;right:0;z-index:60;height:68px;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:0 clamp(18px,4vw,56px);background:rgba(243,238,230,.8);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(14,12,11,.08)">
    <a href="Trust%20Building%20V6.dc.html" style="font-size:23px;font-weight:700;letter-spacing:-.04em;color:#E4041C">upGrad</a>
    <a href="Trust%20Building%20V6.dc.html#p5-words" style="display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;color:#4A453F;transition:color .3s" style-hover="color:#0E0C0B">← Back</a>
  </header>

  <section data-screen-label="01 LinkedIn Posts" style="padding:clamp(120px,16vh,160px) clamp(18px,6vw,96px) clamp(80px,11vh,120px)">
    <div style="display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:28px 48px;margin-bottom:clamp(40px,6vh,64px)">
      <div style="display:flex;flex-direction:column;gap:22px">
        <span data-rv="1" style="display:flex;align-items:center;gap:12px;font-size:12px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:#B80317"><span style="width:6px;height:6px;border-radius:50%;background:#E4041C"></span>In their own words · All posts</span>
        <h1 style="margin:0;font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(48px,6vw,100px);line-height:.92;letter-spacing:-.035em">
          <span style="display:block;overflow:hidden;padding-bottom:.07em"><span data-ln="1" style="display:block">6,404 learners wrote about us.</span></span>
          <span style="display:block;overflow:hidden;padding-bottom:.07em"><span data-ln="1" style="display:block;font-style:italic;color:#6A645C">We didn’t edit a word.</span></span>
        </h1>
      </div>
    </div>

    <div role="tablist" aria-label="Filter posts" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:clamp(28px,4vh,44px)">
      <sc-for list="{{ filters }}" as="f" hint-placeholder-count="5">
        <button type="button" role="tab" aria-selected="{{ f.sel }}" onClick="{{ f.pick }}" style="height:44px;padding:0 20px;border-radius:999px;border:1px solid {{ f.bd }};background:{{ f.bg }};color:{{ f.fg }};font-family:'DM Sans',system-ui,sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:background .3s,color .3s,border-color .3s">{{ f.label }}</button>
      </sc-for>
    </div>

    <div style="columns:3 320px;column-gap:20px">
      <sc-for list="{{ posts }}" as="w" hint-placeholder-count="9">
        <article style="break-inside:avoid;margin:0 0 20px;display:flex;flex-direction:column;background:#FFFFFF;border-radius:18px;font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;color:#1F1F1F;box-shadow:0 1px 2px rgba(14,12,11,.06),0 10px 24px -12px rgba(14,12,11,.18);transition:transform .7s cubic-bezier(.16,1,.3,1),box-shadow .7s cubic-bezier(.16,1,.3,1)" style-hover="transform:translateY(-4px);box-shadow:0 1px 3px rgba(14,12,11,.05),0 12px 24px -12px rgba(14,12,11,.16),0 28px 48px -28px rgba(14,12,11,.18)">
          <header style="display:flex;align-items:center;gap:12px;padding:18px 18px 0">
            <span style="position:relative;flex:none;width:44px;height:44px;border-radius:50%;overflow:hidden;background:#EFE9E1;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:#46403A">{{ w.ini }}<sc-if value="{{ w.hasAv }}" hint-placeholder-val="{{ false }}"><img src="{{ w.av }}" alt="{{ w.name }}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover"></sc-if></span>
            <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:1px">
              <span style="font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ w.name }}</span>
              <span style="font-size:12px;color:#666666;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ w.role }}</span>
              <span style="font-size:11.5px;color:#888888">{{ w.date }} · Edited</span>
            </span>
            <span style="flex:none;align-self:flex-start;width:22px;height:22px;border-radius:4px;background:#0A66C2;color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;font-family:Arial,sans-serif">in</span>
          </header>
          <p style="margin:0;padding:14px 18px 0;font-size:14.5px;line-height:1.6;color:#1F1F1F;text-wrap:pretty">{{ w.text }}</p>
          <sc-if value="{{ w.hasPhoto }}" hint-placeholder-val="{{ false }}">
            <div style="margin:14px 0 0;aspect-ratio:4/3;overflow:hidden;background:#2A2723">
              <img src="{{ w.photo }}" alt="Photo shared by {{ w.name }}" loading="lazy" style="width:100%;height:100%;object-fit:cover;display:block">
            </div>
          </sc-if>
          <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 18px;padding:16px 0 10px;border-bottom:1px solid #EBEBEB;font-size:12px;color:#666666">
            <span style="display:flex;align-items:center;gap:8px"><span style="display:flex"><span style="width:15px;height:15px;border-radius:50%;background:#378FE9;box-shadow:0 0 0 1.5px #fff"></span><span style="margin-left:-4px;width:15px;height:15px;border-radius:50%;background:#DF704D;box-shadow:0 0 0 1.5px #fff"></span><span style="margin-left:-4px;width:15px;height:15px;border-radius:50%;background:#6DAE4F;box-shadow:0 0 0 1.5px #fff"></span></span>{{ w.likes }}</span>
            <span>{{ w.comments }}</span>
          </div>
          <div style="display:grid;grid-template-columns:repeat(4,1fr);padding:4px 8px 8px;font-size:12.5px;font-weight:600;color:#666666">
            <span style="display:flex;align-items:center;justify-content:center;height:36px">Like</span>
            <span style="display:flex;align-items:center;justify-content:center;height:36px">Comment</span>
            <span style="display:flex;align-items:center;justify-content:center;height:36px">Repost</span>
            <span style="display:flex;align-items:center;justify-content:center;height:36px">Send</span>
          </div>
        </article>
      </sc-for>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { f: 'All' };
  componentDidMount() {
    this.reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
    this.io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { this.reveal(e.target); this.io.unobserve(e.target); } }), { rootMargin: '0px 0px -8% 0px' });
    this.scan = () => document.querySelectorAll('[data-ln]:not([data-seen]),[data-rv]:not([data-seen])').forEach(el => { el.setAttribute('data-seen', ''); if (this.reduced) return; el.style.opacity = '0'; this.io.observe(el); });
    this.scan(); setTimeout(this.scan, 400);
  }
  componentWillUnmount() { this.io && this.io.disconnect(); }
  reveal(el) {
    const ln = el.hasAttribute('data-ln'), h = ln && el.closest('h1'), sib = h ? [...h.querySelectorAll('[data-ln]')].indexOf(el) : 0;
    el.style.opacity = '';
    el.animate(ln ? [{ transform: 'translateY(110%) rotate(2deg)' }, { transform: 'none' }] : [{ opacity: 0, transform: 'translateY(24px)', filter: 'blur(6px)' }, { opacity: 1, transform: 'none', filter: 'blur(0)' }],
      { duration: ln ? 1200 : 1000, delay: 120 + sib * 110, easing: 'cubic-bezier(.16,1,.3,1)', fill: 'backwards' });
  }
  renderVals() {
    const P = window.LI_POSTS;
    if (!P) { clearTimeout(this.w); this.w = setTimeout(() => this.forceUpdate(), 60); return {}; }
    const tag = t => /convocation|walk across the stage|walked the stage|degree|cohort, in one frame/i.test(t) ? 'Convocation' : /campus|immersion|in person|meetup|mixer|from the ground up/i.test(t) ? 'Immersion' : /promot|salary|role|lead the team/i.test(t) ? 'Career' : 'Learning';
    const all = P.map(([name, role, av, text, photo], k) => ({
      name, role, text, tag: tag(text), hasPhoto: !!photo, photo: photo ? './assets/' + photo : '', ini: name.split(' ').map(s => s[0]).join(''), hasAv: !!av, av: av ? './assets/avatars/' + av + '.png' : '',
      date: ['2d', '5d', '1w', '1w', '2w', '3w'][k % 6], likes: ['1,284', '962', '2,031', '1,756', '874', '1,412'][k % 6], comments: ['64 comments', '41 comments', '118 comments', '93 comments', '37 comments', '72 comments'][k % 6]
    }));
    const f = this.state.f;
    return {
      filters: ['All', 'Convocation', 'Immersion', 'Career', 'Learning'].map(label => {
        const sel = label === f;
        return { label, sel: sel ? 'true' : 'false', pick: () => this.setState({ f: label }), bg: sel ? '#0E0C0B' : 'transparent', fg: sel ? '#FFFFFF' : '#0E0C0B', bd: sel ? '#0E0C0B' : 'rgba(14,12,11,.24)' };
      }),
      posts: f === 'All' ? all : all.filter(p => p.tag === f)
    };
  }
}
</script>
</body>
</html>
