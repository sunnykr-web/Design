<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&amp;display=swap" rel="stylesheet">
<script src="./convocations.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; background: #F3EEE6; color: #0E0C0B; font-family: 'DM Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; overflow-x: clip; }
  a { color: inherit; text-decoration: none; }
  a:hover { color: inherit; }
  ::selection { background: #E4041C; color: #FFFFFF; }
</style>
</helmet>
<div style="width:100%;overflow-x:clip;background:#F3EEE6;min-height:100vh">
  <header style="position:fixed;top:0;left:0;right:0;z-index:60;height:68px;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:0 clamp(18px,4vw,56px);background:rgba(243,238,230,.8);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(14,12,11,.08)">
    <a href="Trust%20Building%20V6.dc.html" style="font-size:23px;font-weight:700;letter-spacing:-.04em;color:#E4041C">upGrad</a>
    <a href="Trust%20Building%20V6.dc.html#p5-conv" style="display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;color:#4A453F;transition:color .3s" style-hover="color:#0E0C0B">← Back</a>
  </header>

  <section data-screen-label="01 Convocation Stories" style="padding:clamp(120px,16vh,160px) clamp(18px,6vw,96px) clamp(80px,11vh,120px)">
    <div style="display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:28px 48px;margin-bottom:clamp(48px,7vh,80px)">
      <div style="display:flex;flex-direction:column;gap:22px">
        <span data-rv="1" style="display:flex;align-items:center;gap:12px;font-size:12px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:#B80317"><span style="width:6px;height:6px;border-radius:50%;background:#E4041C"></span>Convocation · All stories</span>
        <h1 style="margin:0;font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(48px,6vw,100px);line-height:.92;letter-spacing:-.035em">
          <span style="display:block;overflow:hidden;padding-bottom:.07em"><span data-ln="1" style="display:block">Months on screen.</span></span>
          <span style="display:block;overflow:hidden;padding-bottom:.07em"><span data-ln="1" style="display:block;font-style:italic;color:#6A645C">One day on stage.</span></span>
        </h1>
      </div>
      <p data-rv="1" style="margin:0;max-width:400px;font-size:clamp(16px,1.2vw,18px);line-height:1.6;color:#4A453F;text-wrap:pretty">Trade your virtual classroom for the campus grounds as you finally meet the peers you’ve studied alongside for months.</p>
    </div>

    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:clamp(28px,3vw,44px) clamp(18px,2vw,28px)">
      <sc-for list="{{ items }}" as="o" hint-placeholder-count="7">
        <a data-rv="1" href="{{ o.href }}" onMouseEnter="{{ o.enter }}" onMouseLeave="{{ o.leave }}" style="display:flex;flex-direction:column;gap:16px;color:#0E0C0B">
          <div style="position:relative;aspect-ratio:4/3;border-radius:18px;overflow:hidden;background:{{ o.bg }};transform:{{ o.lift }};box-shadow:{{ o.shadow }};transition:transform .7s cubic-bezier(.16,1,.3,1),box-shadow .7s cubic-bezier(.16,1,.3,1)">
            <img src="{{ o.img }}" alt="{{ o.alt }}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:{{ o.fit }};object-position:{{ o.pos }};padding:{{ o.pad }};display:block;transform:{{ o.zoom }};transition:transform 1.4s cubic-bezier(.16,1,.3,1)">
            <span aria-hidden="true" style="position:absolute;right:14px;bottom:14px;display:flex;align-items:center;gap:10px;height:44px;padding:0 6px 0 18px;border-radius:999px;background:{{ o.btnBg }};color:{{ o.btnFg }};box-shadow:0 8px 20px -6px rgba(14,12,11,.4);font-size:13px;font-weight:600;white-space:nowrap;transition:background .4s,color .4s">View story<span style="display:flex;align-items:center;justify-content:center;width:32px;height:32px;font-size:17px;font-weight:700">→</span></span>
          </div>
          <span style="display:flex;justify-content:space-between;gap:12px;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#6A645C"><span>{{ o.place }}</span><span style="font-variant-numeric:tabular-nums">{{ o.num }}</span></span>
          <span style="font-family:'Instrument Serif',serif;font-size:clamp(26px,2.2vw,32px);line-height:1.06;letter-spacing:-.01em">{{ o.title }}</span>
          <span style="font-size:15px;line-height:1.55;color:#4A453F;text-wrap:pretty">{{ o.desc }}</span>
        </a>
      </sc-for>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { hov: -1 };
  componentDidMount() {
    this.reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
    this.io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { this.reveal(e.target); this.io.unobserve(e.target); } }), { rootMargin: '0px 0px -8% 0px' });
    this.scan = () => document.querySelectorAll('[data-ln]:not([data-seen]),[data-rv]:not([data-seen])').forEach(el => { el.setAttribute('data-seen', ''); if (this.reduced) return; el.style.opacity = '0'; this.io.observe(el); });
    this.scan(); setTimeout(this.scan, 400);
  }
  componentWillUnmount() { this.io && this.io.disconnect(); }
  reveal(el) {
    const ln = el.hasAttribute('data-ln'), h = ln && el.closest('h1,h2,h3'), sib = h ? [...h.querySelectorAll('[data-ln]')].indexOf(el) : 0;
    el.style.opacity = '';
    el.animate(ln ? [{ transform: 'translateY(110%) rotate(2deg)' }, { transform: 'none' }] : [{ opacity: 0, transform: 'translateY(24px)', filter: 'blur(6px)' }, { opacity: 1, transform: 'none', filter: 'blur(0)' }],
      { duration: ln ? 1200 : 1000, delay: 120 + sib * 110, easing: 'cubic-bezier(.16,1,.3,1)', fill: 'backwards' });
  }
  renderVals() {
    const D = window.CONV_DATA;
    if (!D) { clearTimeout(this.w); this.w = setTimeout(() => this.forceUpdate(), 60); return {}; }
    const { hov } = this.state;
    return {
      items: D.map((x, k) => ({
        ...x, num: String(k + 1).padStart(2, '0'), href: 'Convocation%20Detail.dc.html?c=' + x.slug,
        bg: x.post ? '#DAD2C4' : '#2A2723', fit: x.post ? 'contain' : 'cover', pad: x.post ? '6%' : '0', pos: x.slug === 'degree-in-hand' ? 'center 30%' : 'center',
        enter: () => this.setState({ hov: k }), leave: () => this.setState({ hov: -1 }),
        lift: hov === k ? 'translateY(-8px)' : 'translateY(0)', shadow: hov === k ? '0 2px 4px rgba(14,12,11,.06),0 12px 24px -8px rgba(14,12,11,.14),0 40px 72px -28px rgba(14,12,11,.32)' : '0 0 0 rgba(0,0,0,0)',
        zoom: hov === k ? 'scale(1.06)' : 'scale(1)', btnBg: hov === k ? '#E4041C' : '#FFFFFF', btnFg: hov === k ? '#FFFFFF' : '#0E0C0B'
      }))
    };
  }
}
</script>
</body>
</html>
