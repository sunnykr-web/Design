<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explore Programs — Wall of Voices</title>
<meta name="description" content="Pixel replica of the Wall of Voices “Explore Programs” CTA band (Figma 914:18698).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400&family=Fraunces:SOFT,WONK,opsz,wght@0..100,0..1,9..144,400;0..100,0..1,9..144,600&family=Work+Sans:wght@600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<h1 class="sr-only">Wall of Voices — Explore Programs</h1>

<section class="stage" aria-labelledby="ep-title">
  <div class="canvas">

    <!-- Copy block: heading, subheading, CTA -->
    <div class="lockup">
      <h2 class="lockup__title" id="ep-title">One of the Post could be yours</h2>
      <p class="lockup__sub">Tell us where you&rsquo;re starting from and we&rsquo;ll show you the programmes the people in these posts took.</p>
      <a class="lockup__cta" href="#programs">Explore Programs</a>
    </div>

    <!-- Fanned arc. Every card orbits one shared axis 690px below the centre card. -->
    <div class="fan">

      <figure class="fan__seat fan__seat--1">
        <div class="card">
          <div class="card__media"><img src="assets/card.webp" alt="" loading="lazy" decoding="async"></div>
          <span class="card__pill">CTA</span>
          <span class="card__caption">Text here</span>
        </div>
      </figure>

      <figure class="fan__seat fan__seat--2">
        <div class="card">
          <div class="card__media"><img src="assets/card.webp" alt="" loading="lazy" decoding="async"></div>
          <span class="card__pill">CTA</span>
        </div>
      </figure>

      <figure class="fan__seat fan__seat--3">
        <div class="card card--hero">
          <div class="card__media">
            <img src="assets/card.webp" alt="Alumni at an upGrad networking event, mid-conversation." decoding="async">
          </div>
        </div>
      </figure>

      <figure class="fan__seat fan__seat--4">
        <div class="card">
          <div class="card__media"><img src="assets/card.webp" alt="" loading="lazy" decoding="async"></div>
        </div>
      </figure>

      <figure class="fan__seat fan__seat--5">
        <div class="card">
          <div class="card__media"><img src="assets/card.webp" alt="" loading="lazy" decoding="async"></div>
          <span class="card__pill">CTA</span>
          <span class="card__caption">Text here</span>
        </div>
      </figure>

    </div>
  </div>
</section>

</body>
</html>
